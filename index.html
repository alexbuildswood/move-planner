<style>
  :root{
    --bg:#d9d4f8;
    --surface:#ffffff;
    --surface-alt:#f3f1fd;
    --border:#e7e3fa;
    --border-strong:#d3cdf2;
    --text:#2b2540;
    --text-secondary:#756e94;
    --text-muted:#a29bc2;
    --green:#2fb37e;
    --green-bg:#e1f7ee;
    --accent:#7c5cfa;
    --accent-bg:#efe9ff;
    --accent-ink:#ffffff;
    --warning:#e0813a;
    --warning-bg:#fdece0;
    --today:#7c5cfa;
    --soft-red:#e0728a;
    --soft-red-bg:#fdeaf0;
    --soft-red-text:#c14f6c;
  }
  *{box-sizing:border-box;}
  html{scrollbar-color:var(--border-strong) transparent;scrollbar-width:thin;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(700px 420px at 8% -6%, rgba(255,255,255,0.6), transparent 55%),
      radial-gradient(800px 480px at 95% 8%, rgba(255,182,222,0.35), transparent 55%),
      linear-gradient(160deg, #e3e0fb 0%, #cfc8f6 55%, #bdb3f0 100%);
    background-attachment:fixed;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:22px auto;min-height:calc(100vh - 44px);border-radius:26px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--border), 0 30px 70px rgba(94,74,180,0.25);}
  header{padding:22px 20px 16px;border-bottom:0.5px solid var(--border);}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;}
  header p{margin:3px 0 0;font-size:13px;color:var(--text-secondary);}
  .reset-btn{border:none;background:none;font-size:12.5px;color:var(--accent);cursor:pointer;padding:0;}
  .tabs{display:flex;gap:4px;margin:14px 20px;background:var(--surface-alt);border:1px solid var(--border);border-radius:15px;padding:3px;}
  .tab-btn{flex:1;border:none;background:transparent;padding:9px 0;font-size:13.5px;color:var(--text-secondary);border-radius:11px;cursor:pointer;font-family:inherit;}
  .tab-btn.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 2px 10px rgba(94,74,180,0.14);}
  .hint{margin:6px 20px 0;font-size:10.5px;color:var(--text-muted);}
  .sync-bar{padding:12px 20px;border-bottom:0.5px solid var(--border);background:var(--surface-alt);}
  .sync-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .sync-status{font-size:12px;color:var(--text-secondary);}
  .sync-btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
  .sync-btn.primary{background:linear-gradient(135deg, var(--accent), #6a8ffc);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .sync-code-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .sync-code-row code{flex:1;font-size:12.5px;padding:6px 8px;background:var(--surface);border-radius:6px;word-break:break-all;color:var(--text);}
  .sync-actions{display:flex;gap:8px;margin-top:8px;}
  .sync-join{display:flex;gap:8px;margin-top:8px;}
  .sync-join input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:12.5px;font-family:inherit;color:var(--text);background:var(--surface);}
  footer{padding:16px 20px 28px;text-align:center;font-size:11px;color:var(--text-muted);}
  .countdown-wrap{padding:28px 20px 8px;text-align:center;}
  .cd-grid{display:flex;justify-content:center;gap:10px;margin-bottom:6px;}
  .cd-box{background:var(--surface-alt);border:1px solid var(--border);border-radius:14px;padding:14px 8px;min-width:62px;}
  .cd-num{display:block;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);}
  .cd-unit{display:block;font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .cd-arrived{font-size:18px;font-weight:700;color:var(--green);padding:24px 0 16px;}
  .cd-target{font-size:12.5px;color:var(--text-secondary);margin:14px 0 0;}
  .cd-presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:18px 20px;}
  .preset-btn{border:1px solid var(--border-strong);background:var(--surface-alt);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;}
  .preset-btn.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);}
  .cd-form{padding:4px 20px 24px;border-top:0.5px solid var(--border);margin-top:8px;padding-top:18px;}
  .cd-form label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px;}
  .cd-form input[type="text"],.cd-form input[type="date"]{width:100%;padding:9px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:12px;color:var(--text);background:var(--surface);}
  .mv-hero{margin:14px 20px 0;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg, var(--accent) 0%, #6a8ffc 100%);color:#fff;}
  .mv-hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.82);margin-bottom:10px;}
  .mv-hero-top .reset-btn{color:#fff;opacity:.85;font-size:11.5px;}
  .mv-progress-track{background:rgba(255,255,255,.25);border-radius:8px;height:10px;overflow:hidden;}
  .mv-progress-fill{height:100%;width:0;border-radius:8px;background:#fff;transition:width .4s ease;}
  .mv-progress-text{margin:8px 0 0;font-size:12.5px;color:rgba(255,255,255,.92);}
  .mv-phase{margin:14px 20px 0;border:1px solid var(--border);border-radius:16px;background:var(--surface-alt);overflow:hidden;}
  .mv-phase.pinned{border-left:3px solid var(--accent);}
  .mv-phase-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;}
  .mv-phase-head h3{margin:0;font-size:13.5px;font-weight:600;flex:1;letter-spacing:-.005em;}
  .mv-phase-mini{width:50px;height:6px;background:var(--border);border-radius:6px;overflow:hidden;flex-shrink:0;}
  .mv-phase-mini i{display:block;height:100%;width:0;background:var(--green);transition:width .4s ease;}
  .mv-phase-count{font-size:11px;color:var(--text-muted);min-width:32px;text-align:right;font-variant-numeric:tabular-nums;}
  .mv-phase-chev{font-size:10px;color:var(--text-muted);transition:transform .2s;flex-shrink:0;}
  .mv-phase.collapsed .mv-phase-chev{transform:rotate(-90deg);}
  .mv-phase.collapsed .mv-items{display:none;}
  .mv-phase.collapsed .mv-phase-note{display:none;}
  .mv-phase-note{padding:0 14px 10px;margin:-4px 0 0;font-size:11px;color:var(--text-muted);font-style:italic;}
  .mv-items{padding:0 14px 8px;}
  .mv-item{display:flex;gap:10px;padding:9px 0;border-top:0.5px solid var(--border);align-items:flex-start;cursor:pointer;}
  .mv-item:first-child{border-top:none;}
  .mv-item input{width:18px;height:18px;flex-shrink:0;accent-color:var(--green);margin-top:1px;cursor:pointer;}
  .mv-item-text{font-size:13px;line-height:1.4;}
  .mv-item.done .mv-item-text{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .mv-item-hint{display:block;font-size:11px;color:var(--text-muted);font-style:italic;margin-top:1px;text-decoration:none;}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Move to house</h1>
    <p>Jul 21 &rarr; Sep 26, 2026</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="move">Checklist</button>
    <button class="tab-btn" data-tab="countdown">Countdown</button>
  </div>

  <div id="view-countdown" style="display:none;">
    <div class="countdown-wrap">
      <div class="cd-grid" id="cd-grid"></div>
      <p class="cd-target" id="cd-target"></p>
    </div>
    <div class="cd-presets" id="cd-presets">
      <button class="preset-btn" data-date="2026-08-14" data-label="Keys day">Keys day &middot; Aug 14</button>
      <button class="preset-btn" data-date="2026-08-22" data-label="Move-in weekend">Move-in weekend &middot; Aug 22</button>
      <button class="preset-btn" data-date="2026-09-26" data-label="Out of the apartment">Out of the apartment &middot; Sep 26</button>
    </div>
    <div class="cd-form">
      <label for="countdown-label">Counting down to</label>
      <input type="text" id="countdown-label" placeholder="What are you counting down to?">
      <label for="countdown-date">Date</label>
      <input type="date" id="countdown-date">
    </div>
  </div>

  <div id="view-move">
    <div class="sync-bar" id="sync-bar">
      <div class="sync-row">
        <span class="sync-status" id="sync-status">Not synced across devices</span>
        <button class="sync-btn primary" id="sync-setup-btn">Set up sync</button>
      </div>
      <div class="sync-connected" id="sync-connected" style="display:none;">
        <div class="sync-code-row">
          <code id="sync-code-value"></code>
          <button type="button" class="sync-btn" id="sync-copy-btn">Copy code</button>
        </div>
        <div class="sync-actions">
          <button type="button" class="sync-btn" id="sync-refresh-btn">Refresh now</button>
          <button type="button" class="sync-btn" id="sync-disconnect-btn">Disconnect</button>
        </div>
      </div>
      <div class="sync-join" id="sync-join">
        <input type="text" id="sync-join-input" placeholder="Paste sync code from other device">
        <button type="button" class="sync-btn" id="sync-join-btn">Connect</button>
      </div>
    </div>
    <div class="mv-hero">
      <div class="mv-hero-top">
        <span id="mv-progress-text">0 of 0 done</span>
        <button class="reset-btn" id="mv-reset-btn">Reset all</button>
      </div>
      <div class="mv-progress-track"><div class="mv-progress-fill" id="mv-progress-fill"></div></div>
    </div>
    <p class="hint">Weekday evenings: small fast carloads. Weekends: big truck + straps loads, shop setup, storage runs, and anything needing a helper.</p>
    <div id="mv-body"></div>
  </div>

  <footer>Saved automatically in this browser, on this device.</footer>
</div>

<script>
var TAB_VIEWS = ["move","countdown"];
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    var tab = btn.getAttribute("data-tab");
    TAB_VIEWS.forEach(function(v){
      document.getElementById("view-"+v).style.display = (v===tab) ? "block" : "none";
    });
  });
});

var COUNTDOWN_KEY = "move_planner_countdown_v1";
var countdown;
try{ countdown = JSON.parse(localStorage.getItem(COUNTDOWN_KEY)); }catch(e){ countdown = null; }
if(!countdown || !countdown.date){ countdown = { date:"2026-09-26", label:"Out of the apartment" }; }

function pad2(n){ return n < 10 ? "0"+n : ""+n; }

function saveCountdown(){
  localStorage.setItem(COUNTDOWN_KEY, JSON.stringify(countdown));
  document.querySelectorAll(".preset-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-date")===countdown.date && b.getAttribute("data-label")===countdown.label);
  });
}

function renderCountdownForm(){
  document.getElementById("countdown-date").value = countdown.date;
  document.getElementById("countdown-label").value = countdown.label;
}

function tickCountdown(){
  var target = new Date(countdown.date+"T00:00:00");
  var now = new Date();
  var diff = target - now;
  var grid = document.getElementById("cd-grid");
  var targetLabel = document.getElementById("cd-target");
  var dateStr = target.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});

  if(diff <= 0){
    grid.innerHTML = '<div class="cd-arrived">'+(countdown.label || "It")+' is here</div>';
    targetLabel.textContent = dateStr;
    return;
  }

  var totalSeconds = Math.floor(diff/1000);
  var days = Math.floor(totalSeconds/86400);
  var hours = Math.floor((totalSeconds%86400)/3600);
  var minutes = Math.floor((totalSeconds%3600)/60);
  var seconds = totalSeconds%60;

  grid.innerHTML =
    '<div class="cd-box"><span class="cd-num">'+days+'</span><span class="cd-unit">days</span></div>'
    +'<div class="cd-box"><span class="cd-num">'+pad2(hours)+'</span><span class="cd-unit">hrs</span></div>'
    +'<div class="cd-box"><span class="cd-num">'+pad2(minutes)+'</span><span class="cd-unit">min</span></div>'
    +'<div class="cd-box"><span class="cd-num">'+pad2(seconds)+'</span><span class="cd-unit">sec</span></div>';
  targetLabel.textContent = (countdown.label ? countdown.label+" — " : "")+dateStr;
}

document.querySelectorAll(".preset-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    countdown = { date: btn.getAttribute("data-date"), label: btn.getAttribute("data-label") };
    saveCountdown();
    renderCountdownForm();
    tickCountdown();
  });
});

document.getElementById("countdown-date").addEventListener("change", function(e){
  countdown.date = e.target.value || countdown.date;
  saveCountdown();
  tickCountdown();
});
document.getElementById("countdown-label").addEventListener("input", function(e){
  countdown.label = e.target.value;
  saveCountdown();
  tickCountdown();
});

renderCountdownForm();
saveCountdown();
tickCountdown();
setInterval(tickCountdown, 1000);

// ---------------------------------------------------------------- helpers
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---------------------------------------------------------------- Move tab
var MOVE_DATA = [
  { pin:true, title:"Before You Move", note:"Booking + prep, start 2-3 weeks out", items:[
    ["Reserve rental truck", "book for the move-in weekend — covers couch, bed, dresser"],
    ["Rent new storage unit near the new place", "size for combined inventory plus wood, confirm access hours"],
    "Pull empty bins from the old storage unit to pack the apartment",
    ["Packing supplies top-up", "boxes, tape, wrap, blankets, straps"],
    ["Pack non-essentials", "books, decor, off-season clothes, spare linens"],

  ]},
  { pin:true, title:"New Home Utilities", note:"Start about 2 weeks before you take possession", items:[

    ["Water / wastewater — Crossroads Utility Services", "512-246-1400"],

    "Confirm utilities and internet are actually live before you move in to live"
  ]},

    "Disinfect the whole new house (empty, before move-in)",

    "Set aside toolkit: dolly, straps, moving blankets, 2 coolers, extension cords, basic toolbox, first aid + fire blanket",

var MOVE_KEY = "move_planner_move_v1";
var moveState = {};
try{ moveState = JSON.parse(localStorage.getItem(MOVE_KEY)) || {}; }catch(e){ moveState = {}; }
function saveMoveState(){ localStorage.setItem(MOVE_KEY, JSON.stringify(moveState)); }

function moveItemId(p, i){ return p+"_"+i; }

function renderMoveTab(){
  var html = "";
  MOVE_DATA.forEach(function(phase, p){
    var itemsHtml = phase.items.map(function(it, i){
      var label = Array.isArray(it) ? it[0] : it;
      var hint = Array.isArray(it) ? it[1] : null;
      var key = moveItemId(p, i);
      var isDone = !!moveState[key];
      return '<div class="mv-item'+(isDone?' done':'')+'" data-key="'+key+'">'
        + '<input type="checkbox" data-key="'+key+'"'+(isDone?' checked':'')+'>'
        + '<span class="mv-item-text">'+escapeHtml(label)+(hint?'<span class="mv-item-hint">'+escapeHtml(hint)+'</span>':'')+'</span>'
        + '</div>';
    }).join('');
    html += '<div class="mv-phase'+(phase.pin?' pinned':'')+'" data-phase="'+p+'">'
      + '<div class="mv-phase-head">'
      + '<h3>'+escapeHtml(phase.title)+'</h3>'
      + '<span class="mv-phase-mini"><i></i></span>'
      + '<span class="mv-phase-count"></span>'
      + '<span class="mv-phase-chev">&#9660;</span>'
      + '</div>'
      + (phase.note ? '<p class="mv-phase-note">'+escapeHtml(phase.note)+'</p>' : '')
      + '<div class="mv-items">'+itemsHtml+'</div>'
      + '</div>';
  });
  document.getElementById("mv-body").innerHTML = html;
  updateMoveProgress();
}

function updateMoveProgress(){
  var total = 0, doneCount = 0;
  document.querySelectorAll(".mv-phase").forEach(function(sec){
    var items = sec.querySelectorAll(".mv-item");
    var d = sec.querySelectorAll(".mv-item.done").length;
    total += items.length;
    doneCount += d;
    var pct = items.length ? Math.round(d/items.length*100) : 0;
    var mini = sec.querySelector(".mv-phase-mini i");
    if(mini) mini.style.width = pct+"%";
    var count = sec.querySelector(".mv-phase-count");
    if(count) count.textContent = d+"/"+items.length;
  });
  var pct = total ? Math.round(doneCount/total*100) : 0;
  var fill = document.getElementById("mv-progress-fill");
  if(fill) fill.style.width = pct+"%";
  var text = document.getElementById("mv-progress-text");
  if(text) text.textContent = doneCount+" of "+total+" done ("+pct+"%)";
}

function setMoveChecked(key, checked){
  if(checked){ moveState[key] = 1; } else { delete moveState[key]; }
  saveMoveState();
  var row = document.querySelector('.mv-item[data-key="'+key+'"]');
  if(row) row.classList.toggle("done", checked);
  var checkbox = document.querySelector('input[data-key="'+key+'"]');
  if(checkbox) checkbox.checked = checked;
  updateMoveProgress();
  pushMoveState();
}

// ---------------------------------------------------------------- Cross-device sync
var SYNC_KEY = "move_planner_sync_bucket_v1";
var syncBucket = "";
try{ syncBucket = localStorage.getItem(SYNC_KEY) || ""; }catch(e){ syncBucket = ""; }
var SYNC_EMAIL = "anjelmartinez45@gmail.com";
var SYNC_TTL = 315360000;
var syncPolling = null;
var lastSyncedJson = null;

function syncUrl(path){ return "https://kvdb.io/" + syncBucket + path; }

function updateSyncUI(status){
  var statusEl = document.getElementById("sync-status");
  var setupBtn = document.getElementById("sync-setup-btn");
  var connected = document.getElementById("sync-connected");
  var joinBox = document.getElementById("sync-join");
  if(!statusEl) return;
  if(syncBucket){
    statusEl.textContent = status || "Synced across devices";
    setupBtn.style.display = "none";
    connected.style.display = "block";
    joinBox.style.display = "none";
    document.getElementById("sync-code-value").textContent = syncBucket;
  } else {
    statusEl.textContent = status || "Not synced across devices";
    setupBtn.style.display = "inline-block";
    connected.style.display = "none";
    joinBox.style.display = "flex";
  }
}

function pushMoveState(){
  if(!syncBucket) return;
  var json = JSON.stringify(moveState);
  lastSyncedJson = json;
  fetch(syncUrl("/state") + "?ttl=" + SYNC_TTL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: json
  }).catch(function(){});
}

function pullMoveState(showStatus){
  if(!syncBucket) return Promise.resolve();
  return fetch(syncUrl("/state"))
    .then(function(res){
      if(res.status === 404) return null;
      if(!res.ok) throw new Error("sync fetch failed");
      return res.text();
    })
    .then(function(text){
      if(text === null || text === undefined) return;
      if(text === lastSyncedJson) return;
      var remote;
      try{ remote = JSON.parse(text); }catch(e){ return; }
      lastSyncedJson = text;
      moveState = remote || {};
      saveMoveState();
      renderMoveTab();
      if(showStatus) updateSyncUI("Synced just now");
    })
    .catch(function(){
      if(showStatus) updateSyncUI("Sync failed — check connection");
    });
}

function startSyncPolling(){
  if(syncPolling) clearInterval(syncPolling);
  if(!syncBucket) return;
  syncPolling = setInterval(function(){ pullMoveState(false); }, 20000);
}

var syncSetupBtnEl = document.getElementById("sync-setup-btn");
if(syncSetupBtnEl) syncSetupBtnEl.addEventListener("click", function(){
  updateSyncUI("Setting up sync…");
  var body = "email=" + encodeURIComponent(SYNC_EMAIL) + "&default_ttl=" + SYNC_TTL;
  fetch("https://kvdb.io/", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body
  })
  .then(function(res){
    if(!res.ok) throw new Error("bucket create failed");
    return res.text();
  })
  .then(function(id){
    syncBucket = id.trim();
    localStorage.setItem(SYNC_KEY, syncBucket);
    updateSyncUI("Synced across devices");
    pushMoveState();
    startSyncPolling();
  })
  .catch(function(){
    updateSyncUI("Couldn't set up sync — try again");
  });
});

var syncJoinBtnEl = document.getElementById("sync-join-btn");
if(syncJoinBtnEl) syncJoinBtnEl.addEventListener("click", function(){
  var code = document.getElementById("sync-join-input").value.trim();
  if(!code) return;
  syncBucket = code;
  lastSyncedJson = null;
  localStorage.setItem(SYNC_KEY, syncBucket);
  updateSyncUI("Connecting…");
  pullMoveState(true).then(function(){
    startSyncPolling();
  });
});

var syncRefreshBtnEl = document.getElementById("sync-refresh-btn");
if(syncRefreshBtnEl) syncRefreshBtnEl.addEventListener("click", function(){
  updateSyncUI("Refreshing…");
  pullMoveState(true);
});

var syncDisconnectBtnEl = document.getElementById("sync-disconnect-btn");
if(syncDisconnectBtnEl) syncDisconnectBtnEl.addEventListener("click", function(){
  syncBucket = "";
  lastSyncedJson = null;
  localStorage.removeItem(SYNC_KEY);
  if(syncPolling) clearInterval(syncPolling);
  updateSyncUI();
});

var syncCopyBtnEl = document.getElementById("sync-copy-btn");
if(syncCopyBtnEl) syncCopyBtnEl.addEventListener("click", function(){
  var text = syncBucket;
  var btn = syncCopyBtnEl;
  var doneCopy = function(){ var old = btn.textContent; btn.textContent = "Copied!"; setTimeout(function(){ btn.textContent = old; }, 1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(doneCopy).catch(function(){ window.prompt("Copy this sync code:", text); });
  } else {
    window.prompt("Copy this sync code:", text);
  }
});

updateSyncUI();
if(syncBucket){ pullMoveState(true); startSyncPolling(); }

document.addEventListener("click", function(e){
  var item = e.target.closest && e.target.closest(".mv-item");
  if(item && e.target.tagName !== "INPUT"){
    var key = item.getAttribute("data-key");
    setMoveChecked(key, !moveState[key]);
    return;
  }
  var phaseHead = e.target.closest && e.target.closest(".mv-phase-head");
  if(phaseHead){
    phaseHead.closest(".mv-phase").classList.toggle("collapsed");
  }
});

document.addEventListener("change", function(e){
  if(e.target.matches && e.target.matches('.mv-item input[type="checkbox"]')){
    setMoveChecked(e.target.getAttribute("data-key"), e.target.checked);
  }
});

document.getElementById("mv-reset-btn").addEventListener("click", function(){
  if(!confirm("Uncheck everything on the Move tab?")) return;
  moveState = {};
  saveMoveState();
  renderMoveTab();
  pushMoveState();
});

renderMoveTab();
</script>
